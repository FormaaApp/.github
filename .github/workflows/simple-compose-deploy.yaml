name: Simple docker compose deploy

on:
  workflow_call:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.event.repository.name }}
    runs-on: self-hosted

    steps:
      - name: Set app directory
        run: echo "APP_DIR=$HOME/${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: Prepare repository
        run: |
          set -euo pipefail

          echo "Repository: ${{ github.event.repository.name }}"
          echo "Directory: $APP_DIR"

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "Repository does not exist. Cloning..."
            rm -rf "$APP_DIR"
            git clone "${{ github.event.repository.clone_url }}" "$APP_DIR"
          fi

          cd "$APP_DIR"

          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      - name: Decrypt secrets
        run: |
          set -euo pipefail

          cd "$APP_DIR"
          for encrypted_file in env/prod/.env*.enc; do
            decrypted_file="${encrypted_file%.enc}"

            echo "Decrypting: $encrypted_file"

            sops --decrypt "$encrypted_file" > "$decrypted_file"
            chmod 600 "$decrypted_file"
          done

      - name: Deploy
        run: |
          set -euo pipefail

          cd "$APP_DIR"
          echo "PERFECT!!!!"
          # docker compose up -d --build --remove-orphans

      - name: Cleanup
        if: always()
        run: |
          if [ -d "$APP_DIR" ]; then
            cd "$APP_DIR"
            docker image prune -f
          fi
