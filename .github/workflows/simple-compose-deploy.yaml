name: Simple docker compose deploy

on:
  workflow_call:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.event.repository.name }}
    runs-on: self-hosted

    steps:
      - name: Set app directory
        run: echo "APP_DIR=$HOME/${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deploy symlink
        run: |
          set -euo pipefail

          ln -sfn "$GITHUB_WORKSPACE" "$APP_DIR"

      - name: Decrypt secrets
        run: |
          set -euo pipefail

          cd "$APP_DIR"
          if [[ ! -f .sops.yaml ]]; then
            echo "No .sops.yaml found, skipping decryption"
            exit 0
          fi
          while IFS= read -r encrypted_file; do
            decrypted_file="${encrypted_file%.enc}"

            echo "Decrypting: $encrypted_file"

            sops --decrypt "$encrypted_file" > "$decrypted_file"
            chmod 444 "$decrypted_file"
          done < <(find . -type f -name '*.enc' -print)

          find "$APP_DIR" -xtype l -delete

      - name: Deploy
        run: |
          set -euo pipefail

          cd "$APP_DIR"
          docker compose up -d --build --remove-orphans --wait --wait-timeout 60

      - name: Cleanup
        if: always()
        run: |
          if [ -d "$APP_DIR" ]; then
            cd "$APP_DIR"
            docker image prune -f
          fi
